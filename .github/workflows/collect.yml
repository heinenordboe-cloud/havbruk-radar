name: Ukentlig innsamling

on:
  schedule:
    - cron: "0 5 * * 1"      # mandag 05:00 UTC
  workflow_dispatch:          # og manuelt når du vil

permissions:
  contents: write             # minste rettighet som trengs. Ikke utvid.

# To kjøringer som pusher samtidig gir en tapt push og en falsk rød jobb.
# Køing i stedet for parallellitet: den andre venter til den første er ferdig.
concurrency:
  group: innsamling
  cancel-in-progress: false

jobs:
  samle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1      # innsamlingen trenger bare siste commit.
                              # Speilingen har sin egen checkout med depth 0.

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Samle inn
        env:
          # Nøkler kommer fra GitHub Secrets, aldri fra config.yml.
          BARENTSWATCH_KEY: ${{ secrets.BARENTSWATCH_KEY }}
        run: python run.py

      - name: Commit snapshot
        if: always()
        run: |
          git config user.name "havbruk-radar"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet && exit 0

          git commit -m "Snapshot $(date -u +%Y-%m-%d)"

          # Main kan ha flyttet seg mens vi samlet — du redigerer README
          # fra telefonen, eller en annen kjøring rakk å pushe. Uten rebase
          # blir pushen avvist og jobben rød uten at noe faktisk er galt.
          for forsok in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push-forsøk $forsok feilet, prøver igjen om 5s"
            sleep 5
          done
          echo "::error::Klarte ikke pushe snapshot etter tre forsøk."
          exit 1

      # Egen jobb ville skjult feilen. Denne kjører kun ved feil og
      # gjør at GitHub sender deg e-post — som igjen er varselet ditt
      # om at 60-dagersklokka har begynt å tikke.
      - name: Marker feil tydelig
        if: failure()
        run: |
          echo "::error::Innsamlingen feilet $(date -u +%Y-%m-%d). Ingen commit betyr ingen aktivitet."
          exit 1
