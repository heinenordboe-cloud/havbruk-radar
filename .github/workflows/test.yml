name: Tester

# Kjører på hver push og PR. Poenget: du skal aldri oppdage en regresjon
# i core/ mandag 05:00 i produksjon mot ekte API. Suiten tar under ett
# minutt og bruker ikke nett.
#
# Vilkår a for automatisk publisering (publiser_ci.py, fra 02.11.2026)
# krever at DENNE workflowen er grønn på akkurat koden bygget er laget med.
#
# Én jobb på 3.14 fra fase 3 av overgangen (økt 3d, 08.11.2026): samme
# minor som datarepoets workflows, .python-version, Mac-en og kystvakt-1.
# kystvakt-prøvene går med resten. Til fase 3 kjørte de i en egen jobb med
# bare pytest installert; at kystvakt/*.py klarer seg med
# standardbiblioteket, holder nå tests/test_inngangsskript.py.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-24.04

    # `shell: bash` gir `bash --noprofile --norc -eo pipefail`. Uten det
    # kjører GitHub `bash -e`, som mangler pipefail: i `a | b` er det bare
    # exit-koden til b som teller, så en feilende a forsvinner stille.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest tests/ -q
