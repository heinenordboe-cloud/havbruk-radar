name: Tester

# Kjører på hver push og PR. Poenget: du skal aldri oppdage en regresjon
# i core/ mandag 05:00 i produksjon mot ekte API. Suiten tar under ett
# minutt og bruker ikke nett.
#
# Vilkår a for automatisk publisering (publiser_ci.py, fra 02.11.2026)
# krever at DENNE workflowen er grønn på akkurat koden bygget er laget med.
# Alle jobbene må være grønne for at kjøringen er det.
#
# OVERGANGEN TIL 3.14 (økt 3c, 04.11.2026). Mac-en kjører 3.14.7 og
# kystvakt-1 3.14.4; workflowene i datarepoet kjører fortsatt 3.12. Før
# noe annet flyttes, skal hele suiten gå grønt på 3.14 i Actions. Derfor
# kjører hovedjobben på BEGGE til datarepoet er flyttet: 3.12 er det
# innsamlingen kjører i dag, 3.14 er det den skal kjøre. Etterpå blir
# dette én jobb på 3.14 (fase 3 i utkastene).
#
# kystvakt-jobben står som før: compression.zstd finnes først i 3.14, og
# tests/test_kystvakt_*.py hoppet over seg selv på 3.12.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-24.04

    # Begge versjonene kjører ferdig, også når den ene feiler: målet er å
    # se hva 3.14 sier, ikke å stoppe på første røde.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    # `shell: bash` gir `bash --noprofile --norc -eo pipefail`. Uten det
    # kjører GitHub `bash -e`, som mangler pipefail: i `a | b` er det bare
    # exit-koden til b som teller, så en feilende a forsvinner stille.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest tests/ -q --ignore-glob='tests/test_kystvakt_*.py'

  # kystvakt/ bruker bare standardbiblioteket, og prøvene også (conftest.py
  # likeså). Samme minor som kystvakt-1; oppgraderes serveren til en ny
  # minor, oppgraderes denne.
  kystvakt:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # Samme pinning som requirements-dev.txt.
      - run: pip install pytest==8.4.2

      - run: python -m pytest tests/test_kystvakt_*.py -q
