name: Tester

# Kjører på hver push og PR. Poenget: du skal aldri oppdage en regresjon
# i core/ mandag 05:00 i produksjon mot ekte API. Suiten tar under ett
# sekund og bruker ikke nett.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest tests/ -q
