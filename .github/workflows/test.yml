name: Tester

# Kjører på hver push og PR. Poenget: du skal aldri oppdage en regresjon
# i core/ mandag 05:00 i produksjon mot ekte API. Suiten tar under ett
# sekund og bruker ikke nett.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    # `shell: bash` gir `bash --noprofile --norc -eo pipefail`. Uten det
    # kjører GitHub `bash -e`, som mangler pipefail: i `a | b` er det bare
    # exit-koden til b som teller, så en feilende a forsvinner stille.
    # Ingen steg her bruker pipe i dag. Egenskapen skal likevel være på
    # plass før noen skriver den første — den er umulig å oppdage i
    # ettertid, fordi symptomet er en grønn jobb.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest tests/ -q
