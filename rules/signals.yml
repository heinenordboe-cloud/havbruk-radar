# Signalregler. Redigerbare uten kode.
# Første regel som treffer, vinner. Sorter fra mest til minst spesifikk.
#
# MERK: vektene under er kvalifiserte gjetninger, ikke validerte tall.
# Ingen av dem er testet mot faktiske endringer, fordi det ikke finnes
# endringshistorikk ennå. De er et LESEFILTER, ikke en del av dataene:
# data/changelog/ lagrer rå endringer uten signal og vekt, så hele
# scoringen kan kjøres på nytt retroaktivt når vektene revideres.
# Revider dem når endringsloggen har nok rader til å si hva som faktisk
# beveger seg og hvor ofte.
#
# felt                     hvilket observasjonsfelt regelen gjelder
# endringstype             ny | endret | borte
#                          (`utvalgsutvidelse` finnes, men skal ALDRI
#                          brukes her — de radene er ikke bevegelse)
# min_endring_prosent      krever tallverdier; sammenligner absolutt endring
# retning                  opp | ned | begge (standard: begge)
# krev_uendret             navngir et felt som må ha ligget i ro
# krev_dato_etter_forrige  navngir et datofelt hos entiteten som må ligge
#                          etter datoen diffen sammenlignet mot
# vekt                     sorteringsrekkefølge i commit-meldingen

regler:
  # `krev_uendret`: bytter lokaliteten måleenhet samme uke, er
  # prosentendringen regnet mellom to usammenlignbare tall. Da skal
  # regelen ikke treffe — enhetsbyttet får sin egen regel nederst.
  - navn: "Kapasitetsøkning over 10 %"
    felt: "kapasitet"
    endringstype: "endret"
    min_endring_prosent: 10
    retning: "opp"
    krev_uendret: "kapasitet_enhet"
    vekt: 10

  - navn: "Kapasitetskutt over 10 %"
    felt: "kapasitet"
    endringstype: "endret"
    min_endring_prosent: 10
    retning: "ned"
    krev_uendret: "kapasitet_enhet"
    vekt: 10

  # Prosentregning fra null er meningsløs, så nullvernet i koden spiste
  # denne hendelsen helt. `fra_null` ser overgangen i stedet for forholdet.
  #
  # Omfang, som er mindre enn det ser ut: 77 lokaliteter står med kapasitet
  # null, men 72 av dem måler i STK og 50 er ferskvann — settefiskanlegg
  # der feltet er tomt, ikke tomme sjølokaliteter. Reelt berørt er de fem
  # som måler i tonn og de tretten i saltvann.
  - navn: "Kapasitet satt fra null"
    felt: "kapasitet"
    endringstype: "endret"
    fra_null: true
    vekt: 9

  - navn: "Trafikklys endret i produksjonsområde"
    felt: "prodomraade_status"
    endringstype: "endret"
    vekt: 10

  - navn: "Tillatelser flyttet til eller fra lokalitet"
    felt: "tillatelser"
    endringstype: "endret"
    vekt: 9

  # `kilde` og `entity_type` er nødvendige her, ikke pynt: begge reglene
  # under er felt `navn` med endringstype `ny`, og første treff vinner.
  # Uten dem fikk hvert nyregistrerte SELSKAP etiketten "Ny lokalitet".
  - navn: "Ny lokalitet i registeret"
    felt: "navn"
    endringstype: "ny"
    kilde: "akvakultur"
    entity_type: "lokalitet"
    vekt: 8

  - navn: "Midlertidig kapasitet endret"
    felt: "kapasitet_midlertidig"
    endringstype: "endret"
    min_endring_prosent: 5
    vekt: 7

  # Boolske felter: `fra`/`til` sammenligner tekst. Uten dem scoret
  # inngang og utgang av konkurs identisk på vekt 9. Retning kan ikke
  # brukes her — float("False") kaster, og regelen ville sluttet å matche
  # helt stille.
  - navn: "Konkurs åpnet"
    felt: "konkurs"
    endringstype: "endret"
    til: "True"
    vekt: 9

  - navn: "Ut av konkurs"
    felt: "konkurs"
    endringstype: "endret"
    til: "False"
    vekt: 5

  # `krev_dato_etter_forrige`: uten den betyr regelen "nytt for OSS",
  # ikke "nytt i bransjen". Kjøringen 24.08.2026 fyrte den 908 ganger —
  # alle 908 var selskaper som kom inn da næringskodelista ble utvidet,
  # og INGEN av dem var registrert siden forrige snapshot. Nyeste
  # registrering var 04.08, eldste 1995-02-19, 107 av dem fra 1995.
  #
  # Nøkkelen navngir feltet som bærer selskapets egen startdato, og
  # krever at den ligger etter datoen diffen sammenlignet mot
  # (`forrige_observed_at`). Mangler ett av tallene, treffer ikke
  # regelen — se core/signals.py.
  - navn: "Nytt selskap i bransjen"
    felt: "navn"
    endringstype: "ny"
    kilde: "enhetsregisteret"
    entity_type: "selskap"
    krev_dato_etter_forrige: "registreringsdato"
    vekt: 7

  - navn: "Nedbemanning over 20 %"
    felt: "antall_ansatte"
    endringstype: "endret"
    min_endring_prosent: 20
    retning: "ned"
    vekt: 6

  - navn: "Bemanningsvekst over 20 %"
    felt: "antall_ansatte"
    endringstype: "endret"
    min_endring_prosent: 20
    retning: "opp"
    vekt: 5

  - navn: "Tvangsavvikling åpnet"
    felt: "under_tvangsavvikling"
    endringstype: "endret"
    til: "True"
    vekt: 10

  - navn: "Tvangsavvikling avsluttet"
    felt: "under_tvangsavvikling"
    endringstype: "endret"
    til: "False"
    vekt: 5

  - navn: "Aksjekapital økt"
    felt: "aksjekapital"
    endringstype: "endret"
    retning: "opp"
    min_endring_prosent: 1
    vekt: 8

  - navn: "Aksjekapital redusert"
    felt: "aksjekapital"
    endringstype: "endret"
    retning: "ned"
    min_endring_prosent: 1
    vekt: 8

  - navn: "Inn i konsern"
    felt: "er_i_konsern"
    endringstype: "endret"
    til: "True"
    vekt: 8

  - navn: "Ut av konsern"
    felt: "er_i_konsern"
    endringstype: "endret"
    til: "False"
    vekt: 8

  - navn: "Sluttet å rapportere ansatte"
    felt: "ansatte_er_registrert"
    endringstype: "endret"
    til: "False"
    vekt: 4

  - navn: "Begynte å rapportere ansatte"
    felt: "ansatte_er_registrert"
    endringstype: "endret"
    til: "True"
    vekt: 3

  - navn: "Endret vedtektsfestet formål"
    felt: "vedtektsfestet_formaal_hash"
    endringstype: "endret"
    vekt: 4

  - navn: "Flyttet kommune"
    felt: "kommunenummer"
    endringstype: "endret"
    vekt: 4

  - navn: "Navneendring"
    felt: "navn"
    endringstype: "endret"
    vekt: 3

  # Selve enhetsbyttet er en reell hendelse, og den skal ikke forsvinne
  # fordi den er upraktisk for prosentregningen. Lav vekt: den er sjelden
  # interessant i seg selv, men den forklarer hvorfor kapasitetsregelen
  # tidde den uka.
  - navn: "Måleenhet for kapasitet endret"
    felt: "kapasitet_enhet"
    endringstype: "endret"
    vekt: 2
