# Alt som kan justeres uten å røre kode ligger her.

kilder:
  enhetsregisteret:
    # NACE-koder. Start smalt — utvid når du ser hva som er nyttig.
    #
    # Navnene under er de offisielle fra SN2007, verifisert mot SSBs
    # Klass-API 17.08.2026. Ikke skriv dem av fra hukommelsen: de gamle
    # kommentarene her var feil på tre av seks koder, og en feil kode
    # gir tom respons uten feilmelding. Se rules/segments.yml for hele
    # oppslaget og hvilket segment hver kode hører til.
    naeringskoder:
      - "03.211"   # Produksjon av fisk, bløtdyr, krepsdyr og pigghuder i sjø og brakkvann
      - "03.212"   # Produksjon av yngel og settefisk i sjø og brakkvann  (SETTEFISK, ikke skalldyr)
      - "03.221"   # Produksjon av fisk, bløtdyr, krepsdyr og andre dyr som lever i ferskvann
      - "03.222"   # Produksjon av yngel og settefisk i ferskvann  (ny: fantes i data, ikke i søket)
      - "10.201"   # Produksjon av saltfisk, tørrfisk og klippfisk
      - "10.202"   # Slakting av fisk, skalldyr og bløtdyr  (SLAKTING — het "frysing" før 2025)
      - "10.203"   # Frysing og videre bearbeiding av fisk, skalldyr og bløtdyr  (erstatter 10.209)
      - "10.912"   # Produksjon av fôrvarer for akvakultur  (segment: for)
      - "03.300"   # Tjenester tilknyttet fiske, fangst og akvakultur  (segment: bronnbat_service)
      # Fjernet 17.08.2026: "10.209" er utgått i gjeldende SN2007 og ga
      # null treff. Innholdet ligger nå i 10.202 og 10.203.
      #
      # 03.300 er bredere enn havbruk — den dekker også tjenester til
      # fiske og fangst. Segmentet blir overinkluderende inntil det
      # finnes en måte å skille dem på. Se rules/segments.yml.
    sidestorrelse: 100

    # Næringskoder som LEGITIMT kan gi null treff. Tomt søk varsler
    # ellers, fordi en utgått kode ser nøyaktig ut som en tom kode.
    # Kvitteringen er å føre koden opp her — bevisst, med dato og grunn
    # — ikke å dempe varselet.
    tillat_tomt: []

  lusetall:
    # BarentsWatch fiskehelse. Verifisert mot levende tjeneste 18.08.2026,
    # se docs/BARENTSWATCH-FUNN.md.
    #
    # OAuth2 client credentials — to verdier, ikke én nøkkel. Verdiene
    # ligger i miljøet (GitHub Secrets i drift, ~/.havbruk.env lokalt) og
    # aldri i denne fila.
    aktiv: true
    base_url: "https://www.barentswatch.no/bwapi"
    token_url: "https://id.barentswatch.no/connect/token"
    client_id: "${BARENTSWATCH_CLIENT_ID}"
    client_secret: "${BARENTSWATCH_CLIENT_SECRET}"

    # Uker tilbake i tid. Inneværende uke har 5 % rapportert, uke N-3 har
    # 99,0 % og N-4 har 99,3 %. En ufullstendig uke er permanent, og
    # lusetall haster ikke — derfor fire.
    uker_etterslep: 4

    # Under denne andelen rapporterte aktive lokaliteter nekter kilden å
    # skrive uka, og sier fra i stedet.
    min_rapportert_andel: 0.80

    # Felter som REGNES som døde fra en dato, selv om enkeltverdier etter
    # den bryter nullstrekket. Leses bare av `run.py --bygg-feltnormal`,
    # og datoen stemples i normalfila (`dodt_fra`) — en referanse skal
    # kunne svare på hva den ble bygget med uten å slå opp her.
    #
    # har_medikamentell_behandling: målt mot Mattilsynets API 09.10.2026,
    # se docs/MALING-MATTILSYNET-API.md punkt 4. 2023 K4: 198 av 198
    # behandlingsuker også True hos BarentsWatch. Fra uke 1/2024: én True
    # (Torangskjeret, 2024-11-11) mot 625 behandlingsuker til og med uke
    # 46, og 0 mot 1 123 etter. Den ene verdien er et unntak, ikke liv.
    #
    # har_rensefisk: docs/MALING-FUNN-OKTOBER.md F4.6, `hasCleanerfishDeployed`
    # sist True 2023-04-17. Målt på nytt 12.10.2026 over 768 lusetall-
    # snapshots: 6 lokaliteter den uka, 3-5 ukene før, og 0 i hver av de
    # 178 ukene fra 2023-04-24 til 2026-09-14 (1 778 rader hver uke).
    #
    # Et felt her varsler ikke for nullstrekket, men når det får innhold
    # igjen (health._vurder_innhold). Strekket føres fortsatt i
    # health.json, og maks_nullstrekk gjelder som før for alle andre felt.
    dodt_fra:
      har_medikamentell_behandling: "2024-01-01"
      har_rensefisk: "2023-04-24"

  sjotemperatur:
    # BarentsWatch fiskehelse, eksportendepunktet. Verifisert mot levende
    # tjeneste 24.08.2026, se docs/KILDE-SJOTEMPERATUR.md.
    #
    # Samme OAuth2-nøkler som lusetall, men deklarert på nytt HER. Det er
    # ikke duplisering for duplikatets skyld: core/miljo.py leser
    # ${}-syntaksen per AKTIV kilde, så en nøkkel som bare sto under
    # lusetall ville vært usynlig den dagen lusetall slås av og denne
    # står igjen alene.
    aktiv: true
    base_url: "https://www.barentswatch.no/bwapi"
    token_url: "https://id.barentswatch.no/connect/token"
    client_id: "${BARENTSWATCH_CLIENT_ID}"
    client_secret: "${BARENTSWATCH_CLIENT_SECRET}"

    # Temperaturen rapporteres i SAMME ukeskjema som lusetallet.
    # Etterslepet er derfor ikke likt lusetalls — det er det samme.
    # Målt 24.08.2026: uke N-1 har 30,8 %, N-4 har 99,5 %.
    uker_etterslep: 4

    # Andel av IKKE-BRAKKLAGTE lokaliteter som må ha en temperatur før
    # uka skrives uten innsigelse. Målt over alle 763 ferdige uker
    # 2012-2026: laveste uke 76,8 %, median 99,4 %. 0.80 gir 2 falske
    # alarmer (uke 21/2013 og uke 51/2012) og fanger den ferskeste uka
    # med 49 prosentpoengs margin. Se sources/sjotemperatur.py for
    # hvorfor nevneren er ikke-brakklagte og ikke noe som ligner mer.
    min_rapportert_andel: 0.80

  akvakultur:
    # Endepunkt og paginering er verifisert mot levende API 17.08.2026.
    # Feltvalget ligger i sources/akvakultur.py, ikke her —
    # feltnavn er en kontrakt mot historikken og skal ikke kunne endres
    # ved et uhell i en YAML-fil.
    aktiv: true
    base_url: "https://api.fiskeridir.no/pub-aqua/api/v1"

    # Gulvmargin for innholdsvakten. DETTE ER EN VURDERING, IKKE EN
    # MÅLING — det eneste tallet i dette repoet som ikke er målt, og det
    # står her fordi det ikke KAN måles ennå.
    #
    # Akvakulturregisteret er et lisensregister. Lokaliteter kommer og
    # går enkeltvis gjennom forvaltningsvedtak, ikke i klynger. Et fall
    # over 1 % på én uke — atten lokaliteter av 1777 — er ikke normal
    # drift, og det er en påstand om hva slags register dette er.
    #
    # En måling på to observasjoner kan ikke skille 1 fra 50. En
    # vurdering av registerets natur kan det. Forskjellen på de to er
    # ikke akademisk: et målt tall står til dataene motsier det, et
    # vurdert tall står til noen endrer mening, og det skal være tydelig
    # hvilket av dem dette er.
    #
    # Uten den er `gulv` None for alle 29 felt — akvakultur har to
    # observasjonsdatoer, under feltnormal.MIN_DATOER_FOR_GULV = 13 — og
    # gulvprøven er helt av. Målt effekt med 0.01: 0 og 1 lokalitet borte
    # gir stille, 5 gir 2 alarmer, 50 gir 26.
    #
    # FJERNES når akvakultur har et års historikk. Da måles gulvet av
    # kildens egne data, og en vurdering skal ikke overleve dataene som
    # kunne erstattet den. Se docs/beslutninger/
    # 2026-08-25-feltvakten-maler-levering-ikke-innhold.md.
    #
    # Settes IKKE på enhetsregisteret: den svingte 35 % i median og
    # 261 % på det meste over sine tre datoer, og en 1 %-margin ville
    # fyrt konstant.
    gulv_margin: 0.01

  biomasselag:
    # Fiskeridirektoratets Biomasse-lag i Yggdrasil-katalogen: står det
    # fisk på lokaliteten, og hvilken art. Verifisert mot levende
    # tjeneste 10.09.2026. Målingene ligger i modulens docstring og i
    # docs/beslutninger/2026-09-10-biomasselag.md. NLOD, ingen nøkkel —
    # attribusjon «Kilde: Fiskeridirektoratet» kreves.
    #
    # IKKE samme kilde som `biomasse` over. Den er antall fisk per
    # PRODUKSJONSOMRÅDE per måned, med hele serien i hver nedlasting.
    # Denne er ja/nei per LOKALITET, uten historikk og uten mengde.
    #
    # NÅTILSTAND UTEN HISTORIKK. Laget bærer én tilstand, og forrige
    # ukes finnes ikke noe sted etter at den er overskrevet. En uke som
    # ikke hentes er permanent tapt — det er derfor kadensen er ukentlig
    # og ikke sjeldnere.
    aktiv: true
    base_url: "https://gis.fiskeridir.no/server/rest/services/Yggdrasil/Biomasse/MapServer/0"
    # Brukes bare når base_url feiler med HTTP-feil eller error-objekt.
    # Samme lag i WMS-katalogen for akvakultur, målt 02.10.2026 — se
    # RESERVE_BASE i sources/biomasselag.py.
    reserve_url: "https://gis.fiskeridir.no/server/rest/services/fiskeridirWMS_akva/MapServer/6"

  biomasse:
    # Fiskeridirektoratets biomassestatistikk etter produksjonsområde.
    # Verifisert mot levende tjeneste 25.08.2026, se
    # docs/KILDE-BIOMASSE.md. NLOD — ingen nøkkel, ingen registrering,
    # men attribusjon «Kilde: Fiskeridirektoratet» kreves av enhver
    # sammenstilling som bruker tallene.
    #
    # Én statisk fil som bærer HELE serien (2017-10 og framover) i hver
    # nedlasting. Ingen spørrestreng, ingen paginering, ingen API.
    aktiv: true
    url: "https://register.fiskeridir.no/biomassestatistikk/BIOSTAT-LAKS-OMR/biostat-total-omr.csv"

    # MÅNEDER, ikke uker. Fila publiseres på nytt den 20. hver måned, og
    # innrapporteringsfristen er den 7. — måned M er synlig ~50 dager
    # etter at M begynte.
    #
    # Fire og ikke to eller tre. Tallet er ikke valgt for å komme forbi
    # publiseringen, men for å komme forbi REVISJONEN. Målt ved å krysse
    # en Wayback-kopi fra 07.08.2024 mot dagens fil, 3973 felles rader —
    # andel som SENERE ble revidert, etter månedens alder da vi hentet:
    #
    #     0 mnd  28,8 %      3 mnd  10,4 %
    #     1 mnd  19,2 %      4+     ~8-15 %, flatt
    #     2 mnd  11,3 %
    #
    # Kurven flater ut ved alder 2. Resten er permanent omklassifisering
    # som ingen ventetid fjerner. Fire GARANTERER alder >= 2 uansett
    # hvilken dag i måneden cron treffer: kjører vi før den 20., er
    # ferskeste publiserte måned kjøremåneden minus 2. Tre ville gitt
    # alder 1 (19,2 %) halvparten av dagene.
    maaneder_etterslep: 4

    # Nullstrekket som skiller en stille måned fra et dødt felt.
    # STANDARD_MAKS_NULLSTREKK er 13, og det tallet er målt i UKER på
    # lusetall. Her er én kjøring én MÅNED, så 13 ville betydd «si fra
    # etter tretten måneder» — over et år før et dødt felt oppdages.
    # Samme tall, et annet spørsmål.
    #
    # Målt over alle 106 måneder: bare `romming_antall` har nullmåneder
    # i det hele tatt (52 av 106 — halvparten av månedene har null
    # rømminger i hvert eneste produksjonsområde). Strekkfordelingen er
    # {1: 19, 2: 6, 3: 3, 4: 3}, lengste fire.
    #
    # Simulert over de samme 106 månedene:
    #     grense 3 -> 9 alarmmåneder    grense 5 -> 0
    #     grense 4 -> 3 alarmmåneder    grense 6-13 -> 0
    #
    # Fem er første grense uten falsk alarm, men uten margin: én stille
    # måned til hadde fyrt. Åtte er det dobbelte av lengste observerte
    # strekk, gir null falske alarmer på historikken, og fanger et dødt
    # felt på åtte måneder i stedet for tretten.
    maks_nullstrekk: 8

  eierskap:
    # Eierskapskjeden tillatelse -> juridisk enhet, fra Fiskeridirektoratets
    # pub-aqua. Verifisert mot levende tjeneste 02.09.2026, se
    # docs/beslutninger/2026-09-02-eierskapskjeden.md.
    #
    # Ingen nøkkel og ingen registrering, som akvakultur. NLOD, og
    # attribusjon «Kilde: Fiskeridirektoratet» kreves av enhver
    # sammenstilling som bruker tallene.
    #
    # Base-URL ligger her fordi den er en ADRESSE. Personfilteret gjør
    # det IKKE — hvem vi nekter å lagre data om skal ikke kunne endres
    # ved et uhell i en YAML-fil. Det står i sources/eierskap.py, samme
    # sted og samme grunn som core/persondata.py.
    aktiv: true
    base_url: "https://api.fiskeridir.no/pub-aqua/api/v1"

  romming:
    # Rømmingshendelser rapportert fra oppdretter, Fiskeridirektoratets
    # ArcGIS-tjeneste. Verifisert 03.09.2026, se docs/beslutninger/
    # 2026-09-03-romming.md og sources/romming.py.
    #
    # KJØRES AV backfill.py, ikke av run.py: kilden skriver ett snapshot
    # per rømmingsår, og run.py skriver ett snapshot per kjøring.
    # `aktiv` styrer om backfillen finner den.
    #
    # Feltvalget ligger i sources/romming.py og ikke her. Det er ikke
    # bare en kontrakt mot historikken: TO av feltene tjenesten tilbyr
    # inneholder navngitte privatpersoner med telefonnummer, og hvilke
    # felter vi nekter å hente skal ikke kunne endres ved et uhell i en
    # YAML-fil.
    aktiv: true

  unntaksvekst:
    # Mattilsynets oversikt over søknader om unntaksvekst 2025/2026 — en
    # HTML-tabell som ikke er arkivert og ikke finnes i API-et. Målt
    # 09.10.2026, se docs/MALING-UNNTAKSVEKST.md og
    # docs/KILDE-UNNTAKSVEKST.md.
    #
    # Søkerfilteret ligger i sources/unntaksvekst.py og ikke her, av
    # samme grunn som personfilteret i eierskap.
    aktiv: true
    url: "https://mattilsynet.no/fisk-og-akvakultur/kapasitetsokning-2025-2026-oversikt-over-soknader"
    pubaqua_url: "https://api.fiskeridir.no/pub-aqua/api/v1"

  ekspertgruppen:
    # Ekspertgruppen for vurdering av lusepåvirkning — kategori per
    # produksjonsområde per år, altså fasiten trafikklyssystemet styres
    # etter. Verifisert mot fem nedlastede rapporter 26.-27.08.2026, se
    # docs/KILDE-EKSPERTGRUPPEN.md.
    #
    # Ingen nøkkel og ingen avtale: rapportene er offentlige PDF-er.
    # URL-ene ligger IKKE her, men i `RAPPORTER` i kildefila — de er en
    # del av uttrekket, ikke en innstilling. Hver URL hører sammen med
    # nøyaktig én uttrekksfunksjon som er skrevet mot nøyaktig det
    # dokumentet, og å kunne bytte adresse uten å bytte parser ville vært
    # å invitere en kropp inn i feil leser.
    aktiv: true

  trafikklysvedtak:
    # Departementets FARGE per produksjonsområde per tildelingsrunde, lest
    # av kapasitetsjusteringsforskriftene på lovdata.no. Den andre siden
    # av trafikklyssystemet: ekspertgruppen gir RÅDET, denne gir VEDTAKET.
    # Verifisert mot fire nedlastede forskriftskropper 05.09.2026, se
    # docs/KILDE-TRAFIKKLYSVEDTAK.md.
    #
    # Ingen nøkkel og ingen avtale: forskriftene er offentlige. URL-ene
    # ligger IKKE her, men i `FORSKRIFTER` i kildefila — samme begrunnelse
    # som for ekspertgruppen: hver adresse hører sammen med nøyaktig én
    # uttrekksfunksjon skrevet mot nøyaktig det dokumentet.
    #
    # Runde 2026 mangler med vilje. Forskriften var på høring og ikke
    # fastsatt da kilden ble skrevet; fravær framfor gjetning.
    aktiv: true

  reguleringsomraader:
    # HIs FORSLAG om å dele de 13 produksjonsområdene i 28
    # reguleringsområder for utslipp av lakselus. Et råd til NFD avgitt
    # 29.06.2026 — ikke forskrift. Verifisert mot begge levende kilder
    # 09.09.2026, se docs/beslutninger/2026-09-09-reguleringsomraader.md.
    #
    # STATISK. Kilden skriver ÉN dato (2026-06-29) og henter ikke igjen
    # så lenge den ligger. Ingen ny henting betyr ikke at ingenting kan
    # skje: `datasett_versjon` og rapportens utgivelsesdato felles begge
    # av parse() om HI publiserer en ny utgave.
    aktiv: true

    # To adresser fordi kilden henter TO framstillinger av samme grense
    # og sammenligner dem. Geojson-fila er den som lagres; rapportens
    # appendiks 7.1 er kontrollen. De ligger her og ikke i kildefila
    # fordi ingen av dem er bundet til én uttrekksfunksjon slik
    # ekspertgruppens og trafikklysvedtakets adresser er — samme fil,
    # samme parser, uansett vert.
    geojson_url: "https://ftp.nmdc.no/nmdc/IMR/Smittepress/regomr.geojson"
    rapport_url: "https://www.hi.no/hi/nettrapporter/rapport-fra-havforskningen-2026-28"

nettsted:
  # ADRESSEN PÅ NETTSTEDET, i bunnteksten på hver side og på /om/.
  #
  # Fast her fra 07.10.2026. Fram til da kom den fra miljøvariabelen
  # HAVBRUK_KONTAKT, og et bygg der den ikke var satt sa «Ingen
  # kontaktadresse er satt» på hver side — eller fikk en annen adresse
  # enn forrige bygg, avhengig av hvilket skall som bygget. Med bygget
  # flyttet til GitHub Actions ville siden ha båret den adressen som
  # tilfeldigvis lå i Actions' secrets.
  #
  # HAVBRUK_KONTAKT brukes nå BARE til User-Agent (sources/_http.py).
  # De to er ikke samme spørsmål: den ene er hvem leserne skriver til,
  # den andre hvem en etat skal nå når vi henter for mye.
  kontakt: "kontakt@kystloggen.no"

  # HVOR LENGE EN PÅSTAND STÅR SEG på lokalitetssiden, i dager. Eldre enn
  # grensa vises den som «ukjent» med datoen for siste rapport, ikke som
  # «Ja». Se paastand.py.
  #
  # GRENSA ER TO RAPPORTERINGSPERIODER, og perioden er MÅLT 20.10.2026 per
  # kilde, ikke gjettet:
  #
  #   biomasselag  intervall mellom to påfølgende månedsrapporter for samme
  #                lokalitet: 30 eller 31 dager i 987 av 1 105 (89 %). Resten
  #                er hoppede måneder (61, 92, ... dager). Fra månedsslutt til
  #                vi ser rapporten: median 15 dager (min 5, maks 80).
  #                Periode 31 -> 62.
  #   lusetall     uker med tall for samme lokalitet: 7 dager mellom i
  #                384 594 av 402 734 (95,5 %). Periode 7 -> 14, regnet ETTER
  #                etterslepet vi har valgt (kilder.lusetall.uker_etterslep).
  #   akvakultur,  registrene har ingen rapporteringsperiode; påstanden
  #   eierskap     gjelder dagen vi så den, og vi henter hver 7. dag (9 av 9
  #                intervaller for akvakultur, 5 av 6 for eierskap, ett på
  #                12). Periode 7 -> 14.
  #   eierskap_historikk   journalførte overføringer er HENDELSER. En
  #                hendelse foreldes ikke, og grensa er derfor tom.
  #
  # En kilde som ikke står her kan ikke vises på lokalitetssiden: modellen
  # kaster heller enn å gjette en rytme (paastand.aldersgrense).
  #
  # Grensene flytter seg ikke av seg selv (CLAUDE.md 1b-4). Endres en, er
  # det fordi rytmen er målt på nytt.
  aldersgrense:
    biomasselag: {periode: maaned, dager: 62}
    lusetall: {periode: uke, dager: 14}
    akvakultur: {periode: henting, dager: 14}
    eierskap: {periode: henting, dager: 14}
    eierskap_historikk: null

publisering:
  # NORMALBÅNDET for automatisk publisering (publiser_ci.py automatisk,
  # vilkår d). Et databygg går ut av seg selv bare når ukas tall ligger
  # her; ellers venter det på «ja».
  #
  # MÅLT 13.10.2026 over ALLE uker i dataene, med de samme funksjonene som
  # bygger tallene i kvitteringen:
  #
  #   endringer    `antall` i nettsted.les_endringsuker() — overskriftstallet
  #                på forsiden. 8 uker, 2026-35 til 2026-42:
  #                2, 12, 25, 94, 8, 21, 75, 61
  #   lokaliteter  distinkte lokaliteter i hvert akvakultur-snapshot, siste
  #                versjon per dato (= len(felles.akva)). 9 snapshots,
  #                2026-08-17 til 2026-10-12: 1779–1783
  #
  # Regelen:
  #
  #   endringer    min 1, maks 3 × høyeste uke (94). En uke med null
  #                endringer er enten stille eller en tom diff, og en uke
  #                med tre ganger det høyeste vi har sett er enten en stor
  #                uke eller en parser som teller feil. Begge fortjener et
  #                menneske.
  #   lokaliteter  2 % under laveste og over høyeste: 1743–1819. Registeret
  #                har flyttet seg 4 lokaliteter på åtte uker; 2 % er 36.
  #
  # Ingen historisk uke ligger utenfor båndet (det er målt av dem). Med
  # regelen anvendt på ukene FØR hver uke, ville 2026-36 (12 mot maks 6)
  # og 2026-38 (94 mot maks 75) ha stoppet; ingen uke etter 2026-38.
  #
  # BÅNDET FLYTTER SEG IKKE AV SEG SELV (CLAUDE.md 1b-4). Et rullende bånd
  # godtar degradering i sakte film. Det endres av en commit her, og fordi
  # vilkår a krever at koden er den produksjon allerede kjører, går et nytt
  # bånd ut med «ja» før det kan slippe noe gjennom av seg selv.
  normalbaand:
    endringer: {min: 1, maks: 282}
    lokaliteter: {min: 1743, maks: 1819}
