    aapningsdato: '2027-01-11'
    grunnlag: Lusenivået i et produksjonsområde følger årstiden. Anslaget er snittet
      i uke T−4 pluss den vanlige endringen fra den ISO-uka til måluka i 2017–2022,
      for samme PO.
    feil_hvis: MAE for modellen over de forseglede ukene er ikke lavere enn MAE
      for siste verdi og for samme uke i fjor.
